<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       /* Universal Selector - Select Everything(All the HTML Tags) and Gives Style symbol - */

       *{
        color: rgb(103, 33, 5);
        background-color: rgb(216, 190, 151);
        font-style: italic;
       }
    </style>
</head>
<body>
    <h1>Amazon</h1>

    <h2 id="shop">Cafe Irish</h2>

    <p class="hello">Greeting🪇</p>

    <div class="hello">
        <h3>Hello Guys</h3>
    </div>
</body>
</html>
