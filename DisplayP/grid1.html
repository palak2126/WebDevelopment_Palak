<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .store{
            display: grid;
            grid-template-columns: repeat(3,1fr);
                                   /*repeat(No of columns,Size of Each Colum)*/
            gap: 25px;
            background-color: rgb(222, 78, 26);
        }
        .products{
            background-color: aqua;
            border: 1px solid black;
            padding: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="store">
    <div class="products">Product 1</div>
    <div class="products">Product 2</div>
    <div class="products">Product 3</div>
    <div class="products">Product 4</div>
    <div class="products">Product 5</div>
    <div class="products">Product 6</div>
</body>
</html>
