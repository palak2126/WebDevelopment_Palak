<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .banner{
            border: 1px solid black;
            height: 800px;
            text-align: center;
            font-size: 30px;
            text-shadow: 0 2px 4px rgb(30, 16, 187);
            color: rgb(248, 245, 245);
            background-color: rgb(225, 180, 225);
            /*background-image: url('Address/Link');*/
            background-image: url('https://images.pexels.com/photos/30641774/pexels-photo-30641774.jpeg');
            background-repeat: non-repeat;
            background-position: center;
            background-size: cover;
            
            /*filter: blur(5px);*/
            filter: brightness(70%);
        }
    </style>
</head>
<body>
    <div class="banner">
        <h2>Cafe . Coffee 🍵</h2>
    </div>
</body>
</html>
